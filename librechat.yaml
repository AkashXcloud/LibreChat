version: 1.3.15
cache: true
ocr:
  apiKey: ${OCR_API_KEY}
  baseURL: ${OCR_BASEURL}
  mistralModel: mistral-ocr-latest
  strategy: mistral_ocr
  allowedAddresses: []
fileConfig:
  legacyFileUploadUX: true
  ocr:
    supportedMimeTypes:
      - '^application/pdf$'
      - '^image/png$'
      - '^image/jpeg$'
      - '^image/jpg$'
      - '^application/vnd\.openxmlformats-officedocument\.presentationml\.presentation$'
  text:
    supportedMimeTypes:
      - '^application/pdf$'
      - '^text/.*$'
      - '^application/x-ocr-document$'
      - '^application/json$'
webSearch:
  searchProvider: tavily
  scraperProvider: tavily
interface:
