          rgb-surface-primary-alt: '248 249 255'
          rgb-surface-canvas: '247 248 252'
          rgb-surface-secondary: '248 249 255'
          rgb-surface-tertiary: '240 243 252'
          rgb-surface-dialog: '255 255 255'
          rgb-surface-chat: '255 255 255'
          rgb-surface-composer: '248 249 255'

          # Interactive surfaces
          rgb-surface-hover: '240 243 252'
          rgb-surface-hover-alt: '235 237 250'
          rgb-surface-active: '235 230 255'
          rgb-surface-active-alt: '226 218 255'

          # Primary Purple
          rgb-accent-primary: '109 77 255'
          rgb-accent-primary-hover: '98 67 240'

          # Buttons
