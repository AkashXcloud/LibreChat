  modelSelect: true
  parameters: true
  presets: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  fileCitations: true
  feedback: true
  remoteAgents:
    use: true
    create: true
    share: false
    public: false
registration:
  socialLogins:
  - github
  - google
  - discord
  - openid
  - facebook
  - apple
  - saml
actions:
  allowedDomains:
  - swapi.dev
  - librechat.ai
  - google.com
mcpSettings:
  allowedDomains:
  - mcp-server.tesla-stg.azure.akashx.ai
  - fileagent
  - akashxdb-mcp
  - akashx-knowledge
  - akashx-documents
mcpServers:
  mcp-akashxdb:
    type: streamable-http
    # Staging (https://mcp-server.tesla-stg.azure.akashx.ai/mcp) returns 502;
    # using the local akashxdb-mcp container from docker-compose.override.yml.
    url: http://akashxdb-mcp:8000/mcp
    # ties each tool call to its agent run (the run's messageId) in the MCP audit log
    headers:
      X-LibreChat-Message-Id: '{{LIBRECHAT_BODY_MESSAGEID}}'
    requiresOAuth: false
    timeout: 300000
    initTimeout: 150000
  mcp-akashxdb-scoped:
    type: streamable-http
    # Same AkashX MCP server, limited to Cognate's semantic model 1 (Financebench): only its
    # tables, Ontology Views and RagBucket can be queried (see mcp-servers/akashxdb/audit_launcher.py)
    url: http://akashxdb-mcp:8000/mcp
    headers:
      X-LibreChat-Message-Id: '{{LIBRECHAT_BODY_MESSAGEID}}'
      X-Semantic-Model-Id: '1'
    requiresOAuth: false
    timeout: 300000
    initTimeout: 150000
  mcp-akashx-knowledge:
    type: streamable-http
    # AkashX product knowledge base (akashx-knowledge container in docker-compose.override.yml)
    url: http://akashx-knowledge:8000/mcp
    headers:
      X-LibreChat-Message-Id: '{{LIBRECHAT_BODY_MESSAGEID}}'
    requiresOAuth: false
    timeout: 60000
    initTimeout: 60000
  mcp-akashx-documents:
    type: streamable-http
    # Filings in semantic model 1's RagBucket, read page by page without ASK
    # (akashx-documents container in docker-compose.override.yml)
    url: http://akashx-documents:8000/mcp
    headers:
      X-LibreChat-Message-Id: '{{LIBRECHAT_BODY_MESSAGEID}}'
      X-Semantic-Model-Id: '1'
    requiresOAuth: false
    timeout: 120000
    initTimeout: 60000
  mcp-fileagent:
    type: streamable-http
    url: 'http://fileagent:8002/mcp'
    requiresOAuth: false
    timeout: 60000
    initTimeout: 150000
  mcp-playwright:
    type: stdio
    command: /app/node_modules/.bin/playwright-mcp
    args:
    - --headless
    - --no-sandbox
    - --isolated
    - --executable-path
    - /usr/bin/chromium
    timeout: 120000
    initTimeout: 60000
  firecrawl-scraper:
    type: stdio
    command: npx
    args:
    - -y
    - firecrawl-mcp
    env:
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY}"
    timeout: 120000
    initTimeout: 60000
endpoints:
  agents:
    # Programmatic tool calling is the execution substrate the Tool Orchestrator
    # reuses: it builds `configurable.ptcToolMap` from tools whose agent
    # `allowed_callers` include `code_execution`. Without both capabilities the
    # ptcToolMap is never built and the orchestrator has nothing to orchestrate.
    #
    # `run_in_background` unlocks LibreChat's existing detached-tool mechanism
    # (packages/api/src/agents/background.ts). It is only the admin capability
    # gate; individual tools must still opt in via their agent's
    # `tool_options[<tool>].run_in_background` (see below). Firecrawl is a
    # stdio MCP server, so it is never ephemeral and is not in
    # EXCLUDED_BACKGROUND_TOOL_NAMES, which makes it eligible to detach.
    #
    # `skills` and `artifacts` gate the Skills menu entry (Chat/Input/Skills.tsx,
    # Chat/Input/ToolsDropdown.tsx, hooks/Nav/useSideNavLinks.ts) and the Artifacts
    # submenu/panel respectively, all via useAgentCapabilities() against THIS list.
    # Omitting either makes those UI surfaces return null; `deferred_tools`,
    # `web_search`, `memory`, `actions`, `subagents`, `ask_user_question` and
    # `chain` are restored to the upstream default set (config.ts
    # defaultAgentCapabilities) so this list matches the documented defaults.
    # `programmatic_tools` and `run_in_background` remain opt-in additions.
    capabilities:
    - tools
    - programmatic_tools
    - execute_code
    - run_in_background
    - file_search
    - web_search
    - deferred_tools
    - context
    - artifacts
    - skills
    - memory
    - actions
    - subagents
    - ask_user_question
    - chain
    - ocr
  custom:
  - name: Claude-Compatible
    provider: anthropic
    apiKey: ${ANTHROPIC_API_KEY}
    baseURL: https://api.anthropic.com
    headers:
      anthropic-version: '2023-06-01'
    models:
      default:
      - claude-sonnet-4-5
      - claude-opus-4-5
      fetch: false
    titleConvo: true
    titleModel: claude-sonnet-4-5
    activityLabel: true
    activityModel: claude-3-5-haiku
    modelDisplayLabel: Claude (Compatible)
  - name: groq
    apiKey: ${GROQ_API_KEY}
    baseURL: https://api.groq.com/openai/v1/
    models:
      default:
      - llama3-70b-8192
      - llama3-8b-8192
      - llama2-70b-4096
      - mixtral-8x7b-32768
      - gemma-7b-it
      fetch: false
    titleConvo: true
    titleModel: mixtral-8x7b-32768
    modelDisplayLabel: groq
  - name: Mistral
    apiKey: ${MISTRAL_API_KEY}
    baseURL: https://api.mistral.ai/v1
    models:
      default:
      - mistral-tiny
      - mistral-small
      - mistral-medium
      fetch: true
    titleConvo: true
    titleModel: mistral-tiny
    modelDisplayLabel: Mistral
    dropParams:
    - stop
    - user
    - frequency_penalty
    - presence_penalty
  - name: OpenRouter
    apiKey: ${OPENROUTER_KEY}
    baseURL: https://openrouter.ai/api/v1
    headers:
      x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
    models:
      default:
      - meta-llama/llama-3-70b-instruct
      fetch: true
    titleConvo: true
    titleModel: meta-llama/llama-3-70b-instruct
    dropParams:
    - stop
    modelDisplayLabel: OpenRouter
memory:
  disabled: false
  validKeys:
    - preferences
    - work_info
    - personal_info
    - skills
    - interests
    - context
  tokenLimit: 10000
  maxInputTokens: 16000
  personalize: true
  messageWindowSize: 10
  agent:
    enabled: true
    provider: openAI
    model: gpt-4o
    model_parameters:
      temperature: 0.2
      max_tokens: 2000
