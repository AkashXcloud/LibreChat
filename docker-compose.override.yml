# Code Interpreter services are commented out in this file.
# LibreChat's Code Interpreter environment variables and dependency are also disabled.
# FileAgent remains enabled. Uncomment the relevant sections to restore Code Interpreter.

services:
  api:
    container_name: LibreChat
    environment:
      - IMAGE_GEN_OAI_API_KEY=${IMAGE_GEN_OAI_API_KEY}
      - IMAGE_GEN_OAI_MODEL=${IMAGE_GEN_OAI_MODEL:-gpt-image-1}
      - IMAGE_GEN_OAI_DESCRIPTION=${IMAGE_GEN_OAI_DESCRIPTION:-Generate images from the user's prompt.}
      - IMAGE_GEN_OAI_DESCRIPTION_WITH_FILES=${IMAGE_GEN_OAI_DESCRIPTION_WITH_FILES:-Generate or edit images using the provided image files.}
      - IMAGE_GEN_OAI_DESCRIPTION_NO_FILES=${IMAGE_GEN_OAI_DESCRIPTION_NO_FILES:-Generate an image from the user's prompt.}
      - IMAGE_GEN_OAI_PROMPT_DESCRIPTION=${IMAGE_GEN_OAI_PROMPT_DESCRIPTION:-Describe the image you want to generate.}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - OCR_API_KEY=${OCR_API_KEY}
      - OCR_BASEURL=${OCR_BASEURL}
      # `librechat.yaml` resolves the stdio firecrawl-mcp server's
      # FIRECRAWL_API_KEY from the environment, so it must be propagated into
      # this container or the `${...}` placeholder expands to an empty string
      # and Firecrawl calls fail auth. Value comes from .env; never inlined here.
      # - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      # CAP-13 Phase 2: durable RAG ingestion via the Mongo file-task queue.
      # Defaults keep the existing synchronous RAG path; set to true to move
      # /embed off the upload request onto the in-process consumer.
      # - FILE_TASK_DELIVERY_ENABLED=${FILE_TASK_DELIVERY_ENABLED:-false}
      # - FILE_TASK_CONCURRENCY=${FILE_TASK_CONCURRENCY:-4}
      # - FILE_TASK_MAX_ATTEMPTS=${FILE_TASK_MAX_ATTEMPTS:-8}
      # Code Interpreter integration
#       - LIBRECHAT_CODE_BASEURL=http://code-interpreter-api:3112/v1
#       - CODEAPI_AUTH_PROVIDER=librechat-jwt
#       - CODEAPI_JWT_ALGORITHM=EdDSA
#       - CODEAPI_JWT_KID=lc-codeapi-local-2026-05
#       - CODEAPI_JWT_ISSUER=librechat
#       - CODEAPI_JWT_AUDIENCE=codeapi
#       - CODEAPI_JWT_TTL_SECONDS=300
#       - CODEAPI_JWT_MINT_CACHE_SECONDS=30
#       - CODEAPI_TENANT_ID=legacy
    build:
      context: .
      dockerfile: Dockerfile
    image: librechat-dev:cap06
    volumes:
      - librechat-data:/app/storage
      - ./librechat.yaml:/app/librechat.yaml
      - ./mcp-servers/fileagent/output:/tmp/fileagent:ro
    depends_on:
      - mongodb
      - rag_api
      # - code-interpreter-api
      - fileagent

